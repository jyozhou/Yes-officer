function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2000)}
function anim(e,c){e.classList.remove('in','hop','shake');void e.offsetWidth;e.classList.add(c)}
function setBg(b){bgc=b;const e=[$('bgA'),$('bgB')];bgF^=1;e[bgF].style.backgroundImage=b=='black'?'none':'url('+U('bg_'+b+'.jpg')+')';e[bgF].style.opacity=1;e[bgF^1].style.opacity=0}
function spr(e,k,act){if(!k){e.classList.remove('on','act');e.dataset.k='';return}
 if(e.dataset.k!=k){e.dataset.k=k;e.src=U(CH[k].f+'.webp');e.style.height=CH[k].h*97+'%';e.classList.add('on');anim(e,'in')}
 else if(act&&!e.classList.contains('act'))anim(e,'hop');
 e.classList.toggle('act',!!act)}
function dimAll(){$('spL').classList.remove('act');$('spR').classList.remove('act')}
function say(n){const c=CH[n.s],d=$('dlg');let t=n.t,sh=0;if(t[0]=='*'){t=t.slice(1);sh=1}
 $('nm').classList.toggle('hide',!c.n);if(c.n){$('nm').innerHTML=c.n+'<small>'+c.r+'</small>';$('nm').style.background='linear-gradient(100deg,'+c.c+','+c.c+'cc)'}
 if(n.s=='我'){spr($('spL'),'我',1);$('spR').classList.remove('act')}else if(c.f){spr($('spR'),n.s,1);$('spL').classList.remove('act')}else dimAll();
 d.className=n.s=='典'?'dict':n.s=='旁'?'nar':t[0]=='（'?'th':'';if(sh)anim($('stage'),'shake');
 full=t;hist.push((c.n?'<b>'+c.n+'</b>':'')+t);let k=0;clearInterval(tm);clearTimeout(at);const tx=$('tx');let fs=1;tx.style.setProperty('--k',1);tx.textContent=full;while(tx.scrollHeight>tx.clientHeight+2&&fs>.5){fs-=.04;tx.style.setProperty('--k',fs)}tx.textContent='';$('nx').classList.remove('show');
 if(n.s=='典')beep(880,.25,.04);
 tm=setInterval(()=>{$('tx').textContent=full.slice(0,++k);if(k>=full.length)fin()},24)}
function fin(){clearInterval(tm);tm=null;$('tx').textContent=full;$('nx').classList.add('show');if(auto)at=setTimeout(()=>{if(wait=='say')step()},1300+full.length*55)}
function step(){for(;;){cur=i;const n=N[i++];if(!n)return;
 if(n.s){wait='say';say(n);return}
 if(n.go){i=L[n.go];continue}
 if(n.c){wait='ch';dimAll();$('nx').classList.remove('show');const d=$('ch');d.innerHTML='<div class="q">—— 麻小雀，你怎么说？ ——</div>';d.classList.remove('hide');
  n.c.forEach((o,j)=>{const b=document.createElement('button');b.className='cb';b.style.animationDelay=j*.1+'s';b.textContent=o.t;
   b.onclick=e=>{e.stopPropagation();beep(660,.08);setTimeout(()=>beep(990,.12),80);const fx=(o.e.match(/[hxz][+-]\d+/g)||[]);fx.forEach(m=>v[m[0]]+=+m.slice(1));v.n=(v.n||0)+1;
    if(fx.length)toast(fx.map(m=>VN[m[0]]+' '+m.slice(1)).join('　'));hist.push('<span class="c">▶ '+o.t+'</span>');d.classList.add('hide');i=L[o.go];step()};d.appendChild(b)});return}
 if(n.k=='bg'){setBg(n.a);spr($('spL'));spr($('spR'));continue}
 if(n.k=='ch'){wait='card';const a=n.a.split('|');chap=a[0]+'　'+a[1];$('chap').textContent=chap;spr($('spL'));spr($('spR'));
  $('card').innerHTML='<div class="en">'+a[0]+'</div><h1 class="serif">'+a[1]+'</h1><div class="ln"></div><p class="sub serif">'+a[2]+'</p><div class="hint">点击继续</div>';showCard();return}
 if(n.k=='end'){i=L[v.z>=.6*((v.n||10)+1)&&v.z>=v.h&&v.z>=v.x?'E3':v.h>v.x?'E1':v.x>v.h?'E2':'E4'];continue}
 if(n.k=='fin'){wait='fin';const a=n.a.split('|');let u=JSON.parse(LS.bvE||'[]');if(!u.includes(a[0]))u.push(a[0]);LS.bvE=JSON.stringify(u);beep(523,.5,.05);setTimeout(()=>beep(784,.7,.05),200);
  $('card').innerHTML='<div class="en">ENDING 0'+a[0]+'</div><h1 class="serif" style="font-size:3.8em">'+a[1]+'</h1><div class="ln"></div><p>'+a[2]+'</p><div class="st">鹤总信任 '+v.h+'　·　萧主任赏识 '+v.x+'　·　良心 '+v.z+'　｜　已解锁结局 '+u.length+' / 4</div><div class="hint">点击返回标题，试试别的选择</div>';showCard();return}}}
function showCard(){const c=$('card');c.classList.remove('hide');c.style.animation='none';void c.offsetWidth;c.style.animation=''}
function hideAll(){['card','ch','log','title'].forEach(x=>$(x).classList.add('hide'))}
function title(){wait='';clearInterval(tm);clearTimeout(at);hideAll();$('title').classList.remove('hide');$('un').textContent='已解锁结局 '+JSON.parse(LS.bvE||'[]').length+' / 4';$('ct').classList.toggle('hide',!LS.bvS2)}
function start(at){goFull();i=at||0;v={h:0,x:0,z:0,n:0};hist=[];chap='';$('chap').textContent='';setBg('black');spr($('spL'));spr($('spR'));$('tx').textContent='';$('nm').classList.add('hide');hideAll();step()}
function load(){if(!LS.bvS2)return toast('没有存档');const s=JSON.parse(LS.bvS2);i=s.cur;v=s.v;hist=s.hist;chap=s.chap;$('chap').textContent=chap;setBg(s.bg);spr($('spL'),s.L);spr($('spR'),s.R);hideAll();step();toast('读档成功')}
$('stage').onclick=()=>{if(wait=='say'){clearTimeout(at);if(tm)fin();else{beep(520,.03,.02);step()}}
 else if(wait=='card'){$('card').classList.add('hide');step()}else if(wait=='fin')title()};
const B=(id,f)=>$(id).onclick=e=>{e.stopPropagation();beep(600,.04);f()};
B('st',start);B('ct',load);B('bl',load);B('bt',title);
B('bs',()=>{if(wait!='say'&&wait!='ch')return;LS.bvS2=JSON.stringify({cur,v,bg:bgc,chap,L:$('spL').dataset.k||'',R:$('spR').dataset.k||'',hist:wait=='say'?hist.slice(0,-1):hist});toast('已存档')});
B('ba',()=>{auto^=1;$('ba').classList.toggle('onx',!!auto);if(auto&&wait=='say'&&!tm)step();if(!auto)clearTimeout(at)});
B('bm',()=>{snd^=1;$('bm').classList.toggle('onx',!!snd)});
function showLog(h,t){$('log').innerHTML='<h2 class="serif">'+t+'</h2>'+h+'<p style="color:#8d93ad;text-align:center">（点击任意处关闭）</p>';$('log').classList.remove('hide')}
B('bh',()=>{showLog(hist.map(h=>'<p>'+h+'</p>').join(''),'对话记录');$('log').scrollTop=1e6});
B('gl',()=>{const u=JSON.parse(LS.bvE||'[]');showLog(EN.map((e,j)=>'<p><b>结局 0'+(j+1)+'</b>'+(u.includes(''+(j+1))?e:'？？？（尚未解锁）')+'</p>').join(''),'结局图鉴')});
B('cs',()=>showLog(N.map((n,j)=>n.k=='ch'?'<button class="cb" data-i="'+j+'">'+n.a.split('|').slice(0,2).join('　')+'</button>':'').join(''),'章节选择'));
$('log').onclick=e=>{e.stopPropagation();$('log').classList.add('hide');const d=e.target.dataset.i;if(d!=null){beep(600,.04);start(+d)}};
document.onkeydown=e=>{if((e.key==' '||e.key=='Enter')&&$('title').classList.contains('hide')&&$('log').classList.contains('hide')&&$('ch').classList.contains('hide')){e.preventDefault();$('stage').click()}};
title();
</script></body></html>
